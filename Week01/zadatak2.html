<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>SUPIT - oznaka &lt;table&gt;</h1>
    <h3>Elementi oznake &lt;table&gt;:</h3>
    <ol type="1">
      <li>Element <strong>&lt;caption&gt;</strong></li>
      <li>
        Element za grupiranje redaka:
        <ol type="a">
          <li><strong>&lt;thead&gt;</strong></li>
          <li><strong>&lt;tbody&gt;</strong></li>
          <li><strong>&lt;tfoot&gt;</strong></li>
        </ol>
      </li>
      <li>Elementi za definiranje retka &lt;tr&gt;</li>
      <ul>
        <li><strong>&lt;th&gt;</strong> - naslovni redak</li>
        <li><strong>&lt;td&gt;</strong> - ćelija</li>
      </ul>
    </ol>
  </body>
</html>
